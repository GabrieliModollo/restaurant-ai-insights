name: Publicar demo

# Publica o simulador no Hugging Face Spaces depois de cada merge na main.
# Só roda quando a variável HF_SPACE e o segredo HF_TOKEN estão configurados no repositório.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-demo
  cancel-in-progress: false

jobs:
  publicar:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Instalar o cliente do Hugging Face
        run: python -m pip install huggingface_hub==2.3.0
      - name: Publicar no Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: python -m deploy.publicar_space
