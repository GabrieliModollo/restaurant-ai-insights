name: Testes do simulador

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Testar Python
        run: python -m pytest -q
      - name: Testar JavaScript
        run: node --test 'tests/js/*.test.mjs'
      - name: Conferir a referência da avaliação
        run: python -m scripts.avaliar_explicacoes
      - name: Instalar ferramentas de teste no navegador
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2 @axe-core/playwright@4.11.1 axe-core@4.11.4
          npx --no-install playwright install --with-deps chromium
      - name: Validar o painel de referência no celular
        run: |
          python -m uvicorn src.simulador.api:app --host 127.0.0.1 --port 8020 > "$RUNNER_TEMP/rai-uvicorn.log" 2>&1 &
          rai_pid=$!
          trap 'kill "$rai_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/rai-uvicorn.log"' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8020/api/campos > /dev/null
          node tests/browser/referencia.cjs
